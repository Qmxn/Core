name: Fork

on:
  workflow_dispatch:

# 核心修复 1: 显式声明写权限
permissions:
  contents: write

jobs:
  Fork:
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Shanghai'

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4.2.1
        with:
          ref: X 
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # 获取完整历史，防止 push 冲突

      - name: Clone and Sync
        run: |
          # 核心修复 2: 确保 #### 替换成了真实的仓库地址
          repo_url="https://github.com/shiteThings/Cloudflare-Navihive.git"
          
          echo "开始克隆目标仓库..."
          git clone "$repo_url" tmpfile

          # 检查克隆是否成功
          if [ ! -d "tmpfile" ]; then
            echo "错误: 克隆目标仓库失败！"
            exit 1
          fi

          # 删除目标仓库的 git 记录和 workflow 配置
          rm -rf tmpfile/.git
          rm -rf tmpfile/.github/workflows

          # 核心修复 3: 使用更可靠的同步方式
          # 用 rsync 或简单的 cp 同步，这里排除掉 tmpfile 自身
          cp -rn tmpfile/* . 2>/dev/null || true
          cp -rn tmpfile/.[^.]* . 2>/dev/null || true

          rm -rf tmpfile

      - name: Add and Commit
        run: |
          # 设置用户信息
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 检查状态
          git status
          
          if [[ -n $(git status -s) ]]; then
            git add -A
            git commit -m "Auto Update $(date +'%Y-%m-%d %H:%M')"
            
            # 这里的 origin 已经是当前运行 action 的仓库
            # 强制推送到分支 X
            git push --force origin HEAD:X
          else
            echo "没有发现任何文件变动。"
          fi

      - name: Cleanup Workflow
        uses: Mattraks/delete-workflow-runs@v2 # 建议使用稳定版本号
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 2
