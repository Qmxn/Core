name: Fork

on:
  workflow_dispatch:

# 必须显式开启写权限
permissions:
  contents: write
  actions: write

jobs:
  Fork:
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Shanghai'

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v6.0.1
        with:
          ref: X 
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # 保证获取完整历史

      - name: Sync Files
        run: |
          # 设定目标仓库
          repo_url="https://github.com/shiteThings/Cloudflare-Navihive.git"
          
          echo "Cloning source repository..."
          git clone --depth 1 "$repo_url" tmp_source

          # 确保克隆成功
          if [ ! -d "tmp_source" ]; then
            echo "Error: Failed to clone the source repository."
            exit 1
          fi

          # 移除不需要同步的 Git 记录和 Workflow 定义
          rm -rf tmp_source/.git
          rm -rf tmp_source/.github/workflows

          # 使用 rsync (更可靠) 或改进后的 cp 同步文件
          # . 表示当前目录（即你的 X 分支根目录）
          echo "Copying files..."
          cp -rf tmp_source/. . 
          
          # 清理临时文件夹
          rm -rf tmp_source

      - name: Add and Commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 调试：查看当前目录下有哪些文件，确保同步成功
          ls -la
          
          # 检查是否有变动
          if [[ -n $(git status -s) ]]; then
            git add -A
            git commit -m "Auto Update $(date +'%Y-%m-%d %H:%M')"
            
            # 使用 HEAD 推送到 X 分支
            git push --force origin HEAD:X
          else
            echo "No changes detected. Skipping push."
          fi

      - name: Cleanup Workflow
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 2
