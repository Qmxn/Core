name: Fork

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Fork:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: X
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Clone source repo
      run: |
        git clone https://github.com/shiteThings/Cloudflare-Navihive.git tmp
        rm -rf tmp/.github/workflows
        rsync -av --delete tmp/ ./ --exclude .git --exclude .github/workflows
        rm -rf tmp

    - name: Commit & Push
      run: |
        if [[ -n "$(git status -s)" ]]; then
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add -A
          git commit -m "Sync from upstream"
          git push --force origin X
        else
          echo "No changes"
        fi
